0},{"b":"02","s":"02-vowels","t":"泰语元音 · 九短九长","p":4,"h":"前三对：声调不变","x":"ปาก/ปัก · ตาก/ตัก · คน/โคน","th":1},{"b":"02","s":"02-vowels","t":"泰语元音 · 九短九长","p":4,"h":"前三对：声调不变","x":"这三对的声调相同，所以「长短」是它们唯一的区别。为什么相同？因为它们的尾音是 ก 或 น ，按规则都落进同一类音节（见 p.5），调号也一样。","th":1},{"b":"02","s":"02-vowels","t":"泰语元音 · 九短九长","p":4,"h":"前三对：声调不变","x":"ปาก 与 ปัก 的注音在字典里分别是 bpaak 与 pàk，调号看起来不同——那是两套罗马化标记的差异（一个标长音、一个标调），不是泰语声调不同。判断声调请看调号与音节类别，不要看罗马字。","th":1},{"b":"02","s":"02-vowels","t":"泰语元音 · 九短九长","p":4,"h":"第四对：声调也换","x":"ดู / ดุ","th":1},{"b":"02","s":"02-vowels","t":"泰语元音 · 九短九长","p":4,"h":"第四对：声调也换","x":"为什么这里会变","th":0},{"b":"02","s":"02-vowels","t":"泰语元音 · 九短九长","p":4,"h":"第四对：声调也换","x":"ดู 是长元音、无尾音 → 活音节（พยางค์เป็น），平声；ดุ 是短元音、无尾音 → 死音节（พยางค์ตาย），声调要按另一套算，落在低声。","th":1},{"b":"02","s":"02-vowels","t":"泰语元音 · 九短九长","p":4,"h":"第四对：声调也换","x":"一句话","th":0},{"b":"02","s":"02-vowels","t":"泰语元音 · 九短九长","p":4,"h":"第四对：声调也换","x":"长短不只换词，还可能把声调一起带走——但只有「没有尾音」时才这样。","th":0},{"b":"02","s":"02-vowels","t":"泰语元音 · 九短九长","p":4,"h":"第四对：声调也换","x":"对照","th":0},{"b":"02","s":"02-vowels","t":"泰语元音 · 九短九长","p":4,"h":"第四对：声调也换","x":"ฉันดูเขา","th":1},{"b":"02","s":"02-vowels","t":"泰语元音 · 九短九长","p":4,"h":"第四对：声调也换","x":"我看他（ดู，平声）","th":1},{"b":"02","s":"02-vowels","t":"泰语元音 · 九短九长","p":4,"h":"第四对：声调也换","x":"ถูกดุ","th":1},{"b":"02","s":"02-vowels","t":"泰语元音 · 九短九长","p":4,"h":"第四对：声调也换","x":"被骂（ดุ，低声）","th":1},{"b":"02","s":"02-vowels","t":"泰语元音 · 九短九长","p":4,"h":"第四对：声调也换","x":"听力练习法","th":0},{"b":"02","s":"02-vowels","t":"泰语元音 · 九短九长","p":4,"h":"第四对：声调也换","x":"让母语者或合成音连读 8 个词，你只判断「长还是短」，不判断意思。三遍之后再挂意义——先建立长度感，比一开始就背释义有效。","th":0},{"b":"02","s":"02-vowels","t":"泰语元音 · 九短九长","p":5,"h":"长短如何改写声调","x":"决定声调的是三件事一起看：声母类别、音节死活、调号。这一页只讲其中「死活」这一半，完整表见第 03 册。","th":0},{"b":"02","s":"02-vowels","t":"泰语元音 · 九短九长","p":5,"h":"长短如何改写声调","x":"พยางค์เป็น · 活音节 → 按正常规则算","th":1},{"b":"02","s":"02-vowels","t":"泰语元音 · 九短九长","p":5,"h":"长短如何改写声调","x":"长元音 / 有响尾音（น ม ง ย ว）","th":1},{"b":"02","s":"02-vowels","t":"泰语元音 · 九短九长","p":5,"h":"长短如何改写声调","x":"例如 ตา（眼睛）、ดู（看）、คน（人）。活音节才允许带调号 ่ ้ ๊ ๋。","th":1},{"b":"02","s":"02-vowels","t":"泰语元音 · 九短九长","p":5,"h":"长短如何改写声调","x":"พยางค์ตาย · 死音节 → 另一套算法","th":1},{"b":"02","s":"02-vowels","t":"泰语元音 · 九短九长","p":5,"h":"长短如何改写声调","x":"短元音（无尾音）/ 尾音是 ก ด บ","th":1},{"b":"02","s":"02-vowels","t":"泰语元音 · 九短九长","p":5,"h":"长短如何改写声调","x":"例如 ปัก、ดุ、นก。死音节一般不带调号，声调由「声母类别 + 长短」直接定。","th":1},{"b":"02","s":"02-vowels","t":"泰语元音 · 九短九长","p":5,"h":"长短如何改写声调","x":"情况 死活 例子 结果","th":0},{"b":"02","s":"02-vowels","t":"泰语元音 · 九短九长","p":5,"h":"长短如何改写声调","x":"长元音、无尾音 活 ดู · ตา 按活音节规则；ดู 为平声","th":1},{"b":"02","s":"02-vowels","t":"泰语元音 · 九短九长","p":5,"h":"长短如何改写声调","x":"短元音、无尾音 死 ดุ · จะ 换成死音节公式；ดุ 为低声","th":1},{"b":"02","s":"02-vowels","t":"泰语元音 · 九短九长","p":5,"h":"长短如何改写声调","x":"尾音 ก ด บ（长短都算） 死 ปาก · ปัก 两者同为死音节 → 声调相同","th":1},{"b":"02","s":"02-vowels","t":"泰语元音 · 九短九长","p":5,"h":"长短如何改写声调","x":"尾音 น ม ง ย ว 活 คน · โคน 两者同为活音节 → 声调相同","th":1},{"b":"02","s":"02-vowels","t":"泰语元音 · 九短九长","p":5,"h":"长短如何改写声调","x":"这条规则最容易被误读成「短音一定变调」。它不是。变的是「按哪套公式算」，不是「一定换一个调」——ปาก / ปัก 都是死音节，声调就一样；ดู / ดุ 一个活一个死，才会分开。","th":1},{"b":"02","s":"02-vowels","t":"泰语元音 · 九短九长","p":5,"h":"为什么尾音 ก ด บ 特殊","x":"แม่กก · แม่กด · แม่กบ","th":1},{"b":"02","s":"02-vowels","t":"泰语元音 · 九短九长","p":5,"h":"为什么尾音 ก ด บ 特殊","x":"这三个尾音本身不带响音，音节「收得住」，所以不管元音长短都算死音节。这是 ปาก / ปัก 声调相同的原因。","th":1},{"b":"02","s":"02-vowels","t":"泰语元音 · 九短九长","p":5,"h":"为什么响尾音不算死","x":"แม่กง · กน · กม · เกย · เกอว","th":1},{"b":"02","s":"02-vowels","t":"泰语元音 · 九短九长","p":5,"h":"为什么响尾音不算死","x":"ง น ม ย ว 能拖长，音节「拖得动」，算活音节；长短只影响元音本身，不再改公式。","th":1},{"b":"02","s":"02-vowels","t":"泰语元音 · 九短九长","p":5,"h":"为什么响尾音不算死","x":"判断顺序：先看有没有尾音 → 尾音是响音还是 ก ด บ → 没有尾音再看元音长短。三步走完，才轮到调号。","th":1},{"b":"02","s":"02-vowels","t":"泰语元音 · 九短九长","p":6,"h":"符号会消失的三种情况","x":"「看不到符号」不等于「读长音」。这一页是长短最常被骗的地方。","th":0},{"b":"02","s":"02-vowels","t":"泰语元音 · 九短九长","p":6,"h":"符号会消失的三种情况","x":"01","th":0},{"b":"02","s":"02-vowels","t":"泰语元音 · 九短九长","p":6,"h":"สระลดรู ":"这套资料的边界","th":0},{"b":"08","s":"08-maps","t":"画出来的国土 · 两种地图","p":8,"h":"五道练习","x":"1）条约与割让条目来自维基百科正文核对；「治外法权结束年份」不同资料口径不一，本册取最保守表述。","th":0},{"b":"08","s":"08-maps","t":"画出来的国土 · 两种地图","p":8,"h":"五道练习","x":"2）通猜·威尼差恭的引文是转引，未核对《Siam Mapped》原书页码。","th":0},{"b":"08","s":"08-maps","t":"画出来的国土 · 两种地图","p":8,"h":"五道练习","x":"3）本册不给失地面积、也不给统一的「失地项数」，理由见 p.7。","th":0},{"b":"08","s":"08-maps","t":"画出来的国土 · 两种地图","p":8,"h":"五道练习","x":"4）1940 年原件为公共领域（Wikimedia Commons），片中使用的是原件扫描；示意轮廓不是从原件描下来的。","th":0},{"b":"08","s":"08-maps","t":"画出来的国土 · 两种地图","p":8,"h":"五道练习","x":"5）1904 年那次割让、1940–41 年出兵法属印度支那与战后放弃主张，本册均未展开。","th":0}]};
const $ = s => document.querySelector(s);
const norm = s => String(s).toLowerCase();
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ENTRIES = DATA.entries;
const MAX = 150;
let book = null, pageFilter = null, terms = [], pages = [];

// 词条渲染时的定位标签
const where = e => `<span class="no">${e.b}</span><span class="pg">p.${e.p}</span><span class="sec">${esc(e.h)}</span>`;
// 跳到单册 HTML 的原页（锚点由 build.mjs 写进每页 section）；同目录外的 ../<slug>.html
const bookHref = e => `../${e.s}.html#${e.s}-p${e.p}`;

function highlight(text) {
  let out = esc(text);
  for (const t of terms) {
    if (!t) continue;
    const re = new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    out = out.replace(re, m => `\u0001${m}\u0002`);
  }
  return out.replace(/\u0001/g, '<mark>').replace(/\u0002/g, '</mark>');
}

function score(e, ts) {
  let s = 0;
  const h = norm(e.h), x = norm(e.x), t = norm(e.t);
  for (const q of ts) {
    if (!h.includes(q) && !x.includes(q) && !t.includes(q)) return -1;
    if (h.includes(q)) s += 6;
    if (x.includes(q)) s += 2;
    if (t.includes(q)) s += 1;
  }
  return s;
}

function run() {
  const q = norm($('#q').value).trim();
  const raw = q ? q.split(/\s+/).filter(Boolean) : [];
  // `p.5` / `p5` 当页码用（对着 PDF 查时最直接），其余词照常搜
  pages = raw.map(t => (/^p\.?(\d{1,2})$/i.exec(t) || [])[1]).filter(Boolean).map(Number);
  terms = raw.filter(t => !/^p\.?\d{1,2}$/i.test(t));
  $('#clear').classList.toggle('on', !!q);
  const t0 = performance.now();
  let hits = ENTRIES;
  if (book) hits = hits.filter(e => e.b === book);
  if (pageFilter) hits = hits.filter(e => e.p === pageFilter);
  if (pages.length) hits = hits.filter(e => pages.includes(e.p));
  if (terms.length) hits = hits.map(e => ({ e, s: score(e, terms) })).filter(o => o.s >= 0)
    .sort((a, b) => b.s - a.s || a.e.b.localeCompare(b.e.b) || a.e.p - b.e.p).map(o => o.e);

  const active = !!terms.length || !!pages.length || !!book || pageFilter;
  if (!active) {
    $('#results').innerHTML = '';
    $('#count').textContent = '输入关键词开始搜索';
    $('#timing').textContent = '';
    $('#index').style.display = '';
    return;
  }
  $('#index').style.display = 'none';

  const shown = hits.slice(0, MAX);
  $('#count').innerHTML = `找到 <b>${hits.length}</b> 条${book ? ` · 第 ${book} 册` : ''}${pageFilter ? ` · p.${pageFilter}` : ''}${pages.length ? ` · p.${pages.join('/')}` : ''}${terms.length ? ` · 「${esc(terms.join(' '))}」` : ''}`;
  $('#timing').textContent = `${(performance.now() - t0).toFixed(0)} ms`;
  $('#results').innerHTML = hits.length
    ? shown.map(e => `<a class="card" href="${bookHref(e)}"><div class="top">${where(e)}<span class="go">原页 →</span></div>
        <div class="x${e.th ? ' th' : ''}">${highlight(e.x)}</div></a>`).join('')
      + (hits.length > MAX ? `<div class="more">还有 ${hits.length - MAX} 条，再输入一个字缩小范围</div>` : '')
    : `<div class="empty">没有匹配「<b>${esc(terms.join(' ')) || '当前筛选'}</b>」的条目。<br>
        试试：泰文原文（สระ / ยี่สิบ）、中文关键词（量词 / 声调）、页码（p.5）或直接点下面的常用词。</div>
      <div class="hot">${['声调', '量词', '长短', 'สระ', 'ยี่สิบ', '失地'].map(w => `<button data-q="${w}">${w}</button>`).join('')}</div>`;
}

// 册筛选
const chips = $('#chips');
chips.innerHTML = `<button class="chip" data-b="" aria-pressed="true">全部</button>` +
  DATA.books.map(b => `<button class="chip" data-b="${b.no}" aria-pressed="false">${b.no} ${esc(b.title.split(' · ')[0])}</button>`).join('');
chips.addEventListener('click', ev => {
  const btn = ev.target.closest('.chip'); if (!btn) return;
  book = btn.dataset.b || null;
  pageFilter = null;
  [...chips.children].forEach(c => c.setAttribute('aria-pressed', String(c === btn)));
  run();
});

// 主题索引
$('#index').innerHTML = `<div class="sub">按主题浏览 <span>INDEX · ${DATA.books.length} BOOKS</span></div>` +
  DATA.books.map(b => `<details class="book"><summary><span class="no">${b.no}</span>
      <span class="t">${esc(b.title)}</span><span class="c">${b.pages} 页</span></summary>
      <div class="d">${esc(b.desc)}</div>
      <ul>${b.sections.map(s => `<li><button data-b="${b.no}" data-p="${s.p}">
        <span class="pg">p.${s.p}</span><span>${esc(s.h)}</span><span class="n">${s.n}</span></button></li>`).join('')}</ul>
    </details>`).join('') +
  `  <div class="sub">常用词 <span>TRY THESE</span></div>
   <div class="hot">${['声调', '量词', '长短', '罗马音', 'สระ', 'ยี่สิบ', '失地', '助词']
     .map(w => `<button data-q="${w}">${w}</button>`).join('')}</div>`;

$('#index').addEventListener('click', ev => {
  const hot = ev.target.closest('.hot button');
  if (hot) { $('#q').value = hot.dataset.q; run(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  const btn = ev.target.closest('li button');
  if (!btn) return;
  const b = btn.dataset.b, p = btn.dataset.p;
  book = b;
  pageFilter = +p;
  $('#q').value = '';
  [...chips.children].forEach(c => c.setAttribute('aria-pressed', String(c.dataset.b === b)));
  run();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

let timer;
$('#q').addEventListener('input', () => {
  // 打字 = 重新全库搜，不再被上一次「只看某一页」闷住
  pageFilter = null;
  clearTimeout(timer); timer = setTimeout(run, 90);
});
$('#clear').addEventListener('click', () => { $('#q').value = ''; run(); $('#q').focus(); });
$('#fs').textContent = `${DATA.entries.length} 条`;
$('#date').textContent = DATA.generated;
run();
</script>
